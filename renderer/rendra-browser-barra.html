<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 40px; background: #1e1e1e; color: #e6e6e6; font: 12px 'Segoe UI', system-ui, sans-serif; overflow: hidden; user-select: none; }
  body { display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid #333; box-sizing: border-box; }
  button { background: #2a2a2a; color: #e6e6e6; border: 1px solid #3a3a3a; border-radius: 4px; height: 26px; min-width: 28px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: #e8650a; }
  button:disabled { opacity: .4; cursor: default; }
  #url { flex: 1; min-width: 0; height: 26px; background: #161616; border: 1px solid #333; border-radius: 4px; color: #bbb; padding: 0 8px; font-family: Consolas, monospace; font-size: 11px; box-sizing: border-box; }
  #abrir { padding: 0 10px; background: #e8650a; border-color: #e8650a; color: #111; font-weight: 600; }
</style></head><body>
<button id="voltar" title="Voltar" disabled>&#8592;</button>
<button id="avancar" title="Avançar" disabled>&#8594;</button>
<button id="recarregar" title="Recarregar">&#8635;</button>
<input id="url" type="text" readonly aria-label="Endereço">
<button id="abrir" title="Abrir no navegador padrão">Abrir no navegador padrão</button>
<script>
  const $ = i => document.getElementById(i);
  for (const [id, cmd] of [['voltar', 'voltar'], ['avancar', 'avancar'], ['recarregar', 'recarregar'], ['abrir', 'abrir-padrao']]) $(id).onclick = () => window.rb.comando(cmd);
  window.rb.onEstado(s => { $('url').value = s.url; $('voltar').disabled = !s.voltar; $('avancar').disabled = !s.avancar; });
</script></body></html>
